<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Path of Exile 2 Guesser Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script type="module" src="js/app.js"></script>
    
    <link rel="stylesheet" href="/style.css">
</head>
<body>  

<header>
    <h1>Path of Exile 2 Guesser Game</h1>
    <p>Still sane, exile?</p>
</header>

<main>
    <canvas id="bg"></canvas>
    <div id="content-holder">
        <br>
        <section id="game-mode-selector">
            <h4>Game modes</h4>
            <p id="game-mode"></p>
        </section>

        <section id="optionsContainer" class="hidden"></section>
        
        <div id="gameWrap" class="hidden">
            <section id="gameContainer"></section>

            <section id="scoreContainer">
                <span>Score: </span>
                <span id="scoreCounter"></span>
            </section>
        </div>

        <div class="centeredContent">
            <section id="game-over" class="hidden">
                <h3>Game over! </h3><br />
            </section>
        </div>
    </div>
</main>

<footer>
    <h5>by <a href="https://github.com/RichardRicoKlar">Richard Rico Klar</a> | 2026</h5>
</footer>

<script src="js/app.js"></script>
</body>
</html>
